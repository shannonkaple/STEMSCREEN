<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>STEM Task Screen</title>
<link rel="icon" type="image/png" href="./star.png?v=38">
<link rel="stylesheet" href="./styles.css?v=38">
</head>
<body>
<div class="board" id="board">

  <section class="panel learning" data-panel="learning">
    <div class="panel-tools edit-only">
      <span>TITLE</span><button data-font-part="title" data-font-delta="-2">A−</button><button data-font-part="title" data-font-delta="2">A+</button>
      <span>CRITERIA</span><button data-font-part="text" data-font-delta="-2">A−</button><button data-font-part="text" data-font-delta="2">A+</button>
    </div>

    <div class="learning-grid" id="learningGrid">
      <div class="learning-section objective-section">
        <div class="learning-title">
          <span data-edit-key="titles.objective">OBJECTIVE</span>
        </div>
        <div class="objective-content">
          <div class="section-icon-slot" data-section-icon="objective"></div>
          <textarea id="objectiveInput" class="objective-input" placeholder="Type today's objective..."></textarea>
          <div class="objective-text-tools edit-only">
            <span>OBJECTIVE TEXT</span>
            <button id="objectiveTextSmaller" type="button">A−</button>
            <button id="objectiveTextBigger" type="button">A+</button>
          </div>
        </div>
      </div>

      <div class="learning-divider" id="learningDivider"></div>

      <div class="learning-section success-section" id="successSection">
        <div class="learning-title">
          <svg class="title-icon title-icon-trophy" viewBox="0 0 64 64" aria-hidden="true"><path d="M20 14h24v8c0 10-4 17-12 21-8-4-12-11-12-21z" fill="#FFD31B" stroke="#000" stroke-width="3"/><path d="M20 18H10c0 9 4 14 12 16M44 18h10c0 9-4 14-12 16" fill="none" stroke="#000" stroke-width="3" stroke-linecap="round"/><path d="M28 43h8v7h8v6H20v-6h8z" fill="#F9A602" stroke="#000" stroke-width="3"/></svg>
          <span data-edit-key="titles.success">SUCCESS CRITERIA</span>
        </div>
        <div class="success-content">
          <div class="success-list" id="successList"></div>
        </div>
        <div class="list-edit-bar edit-only">
          <span>MARKER</span>
          <button class="marker-choice" data-marker-target="success" data-marker="star" type="button">★</button>
          <button class="marker-choice" data-marker-target="success" data-marker="bullet" type="button">•</button>
          <button class="add-step" id="addSuccessBtn" type="button">+ ADD</button>
        </div>
      </div>
    </div>
  </section>

  <section class="panel countdown-panel" data-panel="countdown">
    <div class="panel-tools edit-only">
      <span>TITLE</span><button data-font-part="title" data-font-delta="-2">A−</button><button data-font-part="title" data-font-delta="2">A+</button>
      <span>TEXT</span><button data-font-part="text" data-font-delta="-2">A−</button><button data-font-part="text" data-font-delta="2">A+</button>
    </div>
    <div class="panel-title countdown-title">
      <svg class="title-icon" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="34" r="21" fill="#fff" stroke="#000" stroke-width="3"/><circle cx="32" cy="34" r="16" fill="#fff" stroke="#F3237C" stroke-width="5"/><path d="M32 34V23M32 34l9 6" stroke="#111" stroke-width="4" stroke-linecap="round"/><path d="M18 12 10 20M46 12l8 8" stroke="#111" stroke-width="4" stroke-linecap="round"/><path d="M23 9h18" stroke="#FFD31B" stroke-width="5" stroke-linecap="round"/></svg>
      <span data-edit-key="titles.countdown">TIME LEFT</span>
    </div>
    <div class="countdown-display" id="countdownDisplay">--:--</div>
    <div class="period-presets" aria-label="Class period end times">
      <button type="button" class="period-btn period-second" data-end-time="09:03">2A</button>
      <button type="button" class="period-btn period-second" data-end-time="09:43">2B</button>
      <button type="button" class="period-btn period-second" data-end-time="10:33">2C</button>
      <button type="button" class="period-btn period-second" data-end-time="11:13">2D</button>
      <button type="button" class="period-btn period-first" data-end-time="12:47">1A</button>
      <button type="button" class="period-btn period-first" data-end-time="13:27">1B</button>
      <button type="button" class="period-btn period-first" data-end-time="14:17">1C</button>
      <button type="button" class="period-btn period-first" data-end-time="14:20">1D</button>
    </div>
    <input id="endTimeInput" class="end-time-input" type="time" aria-label="Time class ends" title="Time class ends">
  </section>

  <section class="panel voice" data-panel="voice">
    <div class="panel-tools edit-only">
      <span>TITLE</span><button data-font-part="title" data-font-delta="-2">A−</button><button data-font-part="title" data-font-delta="2">A+</button>
      <span>TEXT</span><button data-font-part="text" data-font-delta="-2">A−</button><button data-font-part="text" data-font-delta="2">A+</button>
    </div>
    <div class="panel-title"><span data-edit-key="titles.voice">VOICE LEVEL</span></div>
    <div class="voice-buttons" id="voiceButtons">
      <button type="button" class="voice-btn" data-level="0" style="--vc:#F3237C">0</button>
      <button type="button" class="voice-btn" data-level="1" style="--vc:#F47607">1</button>
      <button type="button" class="voice-btn" data-level="2" style="--vc:#FAB910">2</button>
      <button type="button" class="voice-btn" data-level="3" style="--vc:#56A328">3</button>
      <button type="button" class="voice-btn" data-level="4" style="--vc:#22B8F4">4</button>
    </div>
    <div class="voice-label" id="voiceLabel" data-edit-voice-label>TABLE TALK</div>
  </section>

  <section class="panel task" data-panel="task">
    <div class="panel-tools edit-only">
      <span>TITLE</span><button data-font-part="title" data-font-delta="-2">A−</button><button data-font-part="title" data-font-delta="2">A+</button>
      <span>TEXT</span><button data-font-part="text" data-font-delta="-2">A−</button><button data-font-part="text" data-font-delta="2">A+</button>
    </div>
    <div class="panel-title task-title">
      <img class="task-star-img" src="./star.png" alt="">
      <span data-edit-key="titles.task">TASK OF THE DAY</span>
    </div>
    <div class="task-content-grid">
      <textarea class="task-sub" id="taskSub" rows="6" placeholder="Type what students need to do..." aria-label="Task directions"></textarea>

      <div class="task-stage">
        <div class="task-editor edit-only">
        <div class="mode-row">
          <button type="button" class="mode-btn" data-mode="text">TEXT</button>
          <button type="button" class="mode-btn" data-mode="image">IMAGE / GIF</button>
          <button type="button" class="mode-btn" data-mode="video">VIDEO</button>
        </div>
        <div class="task-control" data-control="text">
          <textarea id="taskTextInput" placeholder="Type the task, directions, question, etc."></textarea>
        </div>
        <div class="task-control" data-control="image">
          <label class="file-btn">UPLOAD IMAGE / GIF<input id="imageFileInput" type="file" accept="image/*" hidden></label>
          <input id="imageUrlInput" type="url" placeholder="or paste an image / GIF URL">
          <button class="file-btn" id="useImageUrlBtn" type="button">USE URL</button>
        </div>
        <div class="task-control" data-control="video">
          <label class="file-btn">UPLOAD VIDEO<input id="videoFileInput" type="file" accept="video/*" hidden></label>
          <input id="videoUrlInput" type="url" placeholder="or paste YouTube / MP4 URL">
          <button class="file-btn" id="useVideoUrlBtn" type="button">USE URL</button>
          <label class="task-loop-toggle">
            <input id="taskLoopToggle" type="checkbox">
            <span>REPEAT VIDEO</span>
          </label>
        </div>
        <button class="clear-task" id="clearTaskBtn" type="button">CLEAR TASK MEDIA</button>
      </div>
        <div class="task-preview" id="taskPreview">
          <div class="task-empty">
            <svg class="empty-image-icon" viewBox="0 0 120 100" aria-hidden="true"><rect x="12" y="10" width="96" height="80" rx="10" fill="#fff" stroke="#2c91ce" stroke-width="6"/><circle cx="81" cy="34" r="10" fill="#FFD31B"/><path d="M24 77 48 51l17 17 12-12 21 21z" fill="#56A328"/><path d="M24 77 48 51l17 17" fill="none" stroke="#3e9bd6" stroke-width="4" stroke-linejoin="round"/></svg>
            Add a picture, video, GIF, or text here.
          </div>
        </div>
      </div>
    </div>
  </section>

  <section class="panel reminders" data-panel="reminders">
    <div class="panel-tools edit-only">
      <span>TITLE</span><button data-font-part="title" data-font-delta="-2">A−</button><button data-font-part="title" data-font-delta="2">A+</button>
      <span>TEXT</span><button data-font-part="text" data-font-delta="-2">A−</button><button data-font-part="text" data-font-delta="2">A+</button>
    </div>
    <div class="panel-title">
      <img class="title-star-icon" src="./star.png" alt="">
      <span data-edit-key="titles.reminders">EARLY FINISHERS</span>
    </div>
    <div class="reminder-list" id="reminderList"></div>
    <div class="list-edit-bar edit-only">
      <span>MARKER</span>
      <button class="marker-choice" data-marker-target="reminders" data-marker="star" type="button">★</button>
      <button class="marker-choice" data-marker-target="reminders" data-marker="bullet" type="button">•</button>
      <button class="add-reminder" id="addReminderBtn" type="button">+ ADD</button>
    </div>
  </section>

  <section class="panel bathroom compact-bathroom" id="bathroomPanel" data-panel="bathroom">
    <div class="panel-tools edit-only">
      <span>TITLE</span><button data-font-part="title" data-font-delta="-2">A−</button><button data-font-part="title" data-font-delta="2">A+</button>
      <span>TEXT</span><button data-font-part="text" data-font-delta="-2">A−</button><button data-font-part="text" data-font-delta="2">A+</button>
    </div>
    <div class="panel-title bathroom-title"><span data-edit-key="titles.bathroom">BATHROOM + WATER</span></div>
    <div class="bathroom-current-zone">
      <div class="bathroom-current-layout">
        <div class="bathroom-current-icon-wrap">
          <img class="bathroom-current-icon" src="./bathroom-water-icon.png" alt="Bathrooms and water">
        </div>
        <div id="bathroomCurrent" class="bathroom-current is-empty"></div>
      </div>
    </div>
    <div class="bathroom-bottom-row">
      <div class="table-grid one-row" id="tableGrid">
        <button class="table-btn" data-key="pink" style="--c:#F3237C;--soft:#FFD5E7"><span data-table-label="pink">PINK</span></button>
        <button class="table-btn" data-key="orange" style="--c:#F47607;--soft:#FFE0C6"><span data-table-label="orange">ORANGE</span></button>
        <button class="table-btn" data-key="yellow" style="--c:#FAB910;--soft:#FFF3AD"><span data-table-label="yellow">YELLOW</span></button>
        <button class="table-btn" data-key="green" style="--c:#56A328;--soft:#D9EFCF"><span data-table-label="green">GREEN</span></button>
        <button class="table-btn" data-key="blue" style="--c:#22B8F4;--soft:#D5F0FE"><span data-table-label="blue">BLUE</span></button>
        <button class="table-btn" data-key="purple" style="--c:#7618CF;--soft:#E7DCF6"><span data-table-label="purple">PURPLE</span></button>
      </div>
      <div class="bathroom-actions">
        <button class="mini-btn" id="bathNextBtn" type="button">NEXT</button>
        <button class="mini-btn" id="bathResetBtn" type="button">RESET</button>
      </div>
    </div>
  </section>


  <a class="dashboard-nav grouper-nav" href="./grouper.html?v=38">RAINBOW GROUPER</a>
  <a class="page-arrow page-arrow-right" href="./cleanup.html?v=38" aria-label="Open clean up board">→</a>

  <div class="grade-switch" aria-label="Grade profile">
    <button class="grade-btn" data-grade="first" type="button">1ST GRADE</button>
    <button class="grade-btn" data-grade="second" type="button">2ND GRADE</button>
  </div>

  <div class="utilities">
    <span class="save-status" id="saveStatus">SAVED</span>
    <button class="utility" id="fullscreenToggle" type="button">FULL SCREEN</button>
    <button class="utility" id="editToggle" type="button">EDIT</button>
  </div>
</div>
<script src="./app.js?v=38"></script>
</body>
</html>
