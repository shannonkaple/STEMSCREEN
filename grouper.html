#home{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:auto;padding:6px 0}

.gradebox.is-hidden{display:none!important}
.homewrap.single-grade{grid-template-columns:1fr;width:min(650px,96%)}

.homewrap{width:min(980px,96%);display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
.gradebox{background:#ffffffe6;border:2px solid #ece7f6;border-radius:18px;padding:10px 10px 12px;box-shadow:0 2px 6px #46375a14}
.gradebox.fg{border-color:#f8d1e6}.gradebox.sg{border-color:#cfe8ff}
.gradehead{font:900 clamp(20px,2.2vw,30px)/1 "KAHomebodyClub","VAGTaskscreen",sans-serif;color:#2f2752;text-align:center;margin:2px 0 10px}
.homegrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.homebtn{border-radius:14px;padding:10px 8px;font:700 clamp(14px,1.35vw,20px)/1.05 Manjari,sans-serif;color:#2d2940;background:#fff;box-shadow:0 2px 5px #3c2d5024;text-transform:uppercase;transition:transform .15s}
.fg .homebtn{background:#fff4fb}.sg .homebtn{background:#f5fbff}.homebtn:hover{transform:translateY(-1px)}
#main{display:none;flex:1;flex-direction:column;min-height:0;height:100%;padding-top:6px}
.bar{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:nowrap;margin-top:-9px}

#sub{text-align:center;font-size:clamp(10px,.95vw,14px);font-weight:700;margin:0 0 5px;color:#555}
.sidebtn{position:absolute;top:50%;transform:translateY(-50%);z-index:5;border-radius:12px;padding:8px 10px 6px;font:900 clamp(11px,1vw,15px)/1 "KAHomebodyClub","VAGTaskscreen",sans-serif;box-shadow:0 1px 3px #bbb;white-space:nowrap}.sidebtn:disabled{opacity:.35;cursor:default}#spedB{left:0;background:#ffd1e4;color:#7d1746}#spedB.on{background:#f3237c;color:#fff}#undoB{right:90px;background:#eee;color:#333}#title{max-width:calc(100% - 300px);margin-left:auto!important;margin-right:auto!important}
#groupStar{position:absolute;right:0;top:50%;transform:translateY(-50%);width:82px;height:76px;background:none;padding:0;filter:drop-shadow(0 2px 2px #0002);z-index:4;transition:transform .15s}
#groupStar svg{position:absolute;inset:0;width:100%;height:100%}

.table{position:relative;border:2px solid var(--table-color);border-radius:13px;overflow:hidden;display:flex;flex-direction:column;min-height:0;background:#fff;transition:filter .18s,opacity .18s,transform .18s}
.table.res{background:#eee;border-color:#aaa}.table.off{opacity:.4}

.chips{padding:7px;display:grid;grid-template-columns:1fr 1fr;gap:7px;align-content:start;overflow:auto;min-height:0}
.stu{font-family:"VAGTaskscreen",sans-serif!important;cursor:grab!important;min-height:clamp(42px,5.7vh,58px);border-radius:11px;border:1px solid #ddd;background:#fff;display:grid;place-items:center;font:700 clamp(19px,1.82vw,29px)/1.14 Manjari,sans-serif;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:5px 6px 1px;text-align:center;cursor:pointer;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
.stu.sel{background:#222;color:#fff}.stu:active{cursor:grabbing!important}.stu.drag-over{outline:3px dashed #332B52;outline-offset:2px}
#board.has-focus:after{content:"";position:absolute;inset:-6px;z-index:10;background:#ffffff52;backdrop-filter:blur(6px);border-radius:18px;pointer-events:none}
#board.has-focus .table:not(.focused){filter:blur(2.5px);opacity:.48;pointer-events:none}
.focus-placeholder{visibility:hidden;pointer-events:none}
.table.focused{position:absolute;z-index:20;width:min(720px,70%);height:min(88%,460px);left:50%;top:50%;transform:translate(-50%,-50%);opacity:1!important;filter:none!important;box-shadow:0 20px 65px #2d234157;background:#fff}
.table.focused .th{height:62px;flex-basis:62px;font-size:clamp(32px,3.4vw,48px);padding-right:12px}.table.focused .rbtn{display:none}
.table.focused .chips{align-content:center;gap:13px;padding:18px}.table.focused .stu{min-height:clamp(68px,9vh,88px);font-size:clamp(34px,3.45vw,50px);border-radius:15px;padding-top:8px}
