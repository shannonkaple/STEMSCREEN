<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Clean Up</title>
<style>
@font-face{font-family:"KAHomebodyClub";src:url("./KAHomebodyClub.ttf") format("truetype");font-display:swap}
@font-face{font-family:"VAGTaskscreen";src:url("./VAG-Rounded-Std-Black_47296.ttf") format("truetype");font-display:swap}

:root{
  --pink:#F3237C;
  --orange:#F47607;
  --yellow:#FAB910;
  --green:#56A328;
  --blue:#27B8F5;
  --violet:#7618CF;
}

*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#fff;
}
body{
  font-family:"VAGTaskscreen",Arial,sans-serif;
}

/* EXACT SAME TIGHT RAINBOW BORDER METHOD AS GROUPER */
body:before{
  content:"";
  position:fixed;
  inset:2.2% 1.4%;
  border-radius:6vw;
  box-shadow:
    inset 0 0 0 10px var(--pink),
    inset 0 0 0 20px var(--orange),
    inset 0 0 0 30px var(--yellow),
    inset 0 0 0 40px var(--green),
    inset 0 0 0 50px var(--blue),
    inset 0 0 0 60px var(--violet);
  pointer-events:none;
  z-index:20;
}

.cleanup-shell{
  position:fixed;
  inset:0;
  padding:
    calc(2.2vh + 72px)
    calc(1.4vw + 76px)
    calc(2.2vh + 76px);
  display:grid;
  grid-template-rows:auto minmax(0,1fr);
  gap:16px;
  background:#fff;
}

.top-row{
  min-height:0;
  display:flex;
  justify-content:flex-end;
  align-items:flex-start;
  gap:22px;
  padding-top:2px;
}

.cleanup-title{
  margin-top:18px;
  font-family:"KAHomebodyClub","VAGTaskscreen",sans-serif;
  font-size:clamp(58px,6.5vw,104px);
  line-height:.9;
  color:#FAB910;
  -webkit-text-stroke:2.5px #000;
  paint-order:stroke fill;
  white-space:nowrap;
}

.video-wrap{
  width:min(31vw,470px);
  aspect-ratio:16/9;
  border:5px solid #000;
  border-radius:18px;
  overflow:hidden;
  background:#000;
  box-shadow:0 5px 16px rgba(0,0,0,.22);
  flex:0 0 auto;
}
.video-wrap video{
  width:100%;
  height:100%;
  display:block;
}

.steps-card{
  min-height:0;
  align-self:end;
  margin-bottom:0;
  border:7px solid #000;
  border-radius:28px;
  background:#fff;
  padding:22px 28px 26px;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}
.steps-card img{
  display:block;
  max-width:100%;
  max-height:100%;
  width:100%;
  height:auto;
  object-fit:contain;
}

/* Controls stay INSIDE the inner purple edge. */
.back-arrow,
.fullscreen-btn{
  position:fixed;
  z-index:30;
  background:#fff;
  color:#2d2940;
  border:3px solid #2d2940;
  border-radius:15px;
  text-decoration:none;
  font-family:"VAGTaskscreen",sans-serif;
  font-weight:900;
  box-shadow:0 2px 7px rgba(0,0,0,.15);
}
.back-arrow{
  left:calc(1.4vw + 26px);
  top:50%;
  transform:translateY(-50%);
  width:46px;
  height:46px;
  display:grid;
  place-items:center;
  font-size:27px;
}
.fullscreen-btn{
  right:calc(1.4vw + 28px);
  top:calc(2.2vh + 18px);
  height:43px;
  padding:0 13px;
  font-size:13px;
}

body.presentation-mode{
  position:fixed!important;
  inset:0!important;
  width:100vw!important;
  height:100vh!important;
}

@media(max-width:1000px){
  .cleanup-shell{
    padding:
      calc(2.2vh + 66px)
      calc(1.4vw + 68px)
      calc(2.2vh + 68px);
  }
  .top-row{gap:14px}
  .cleanup-title{font-size:clamp(46px,5.7vw,74px)}
  .video-wrap{width:29vw}
  .steps-card{padding:16px 20px 20px}
}
</style>
</head>
<body>
<a class="back-arrow" href="./index.html?v=30" aria-label="Back to Task Screen">←</a>
<button class="fullscreen-btn" id="cleanupFullscreen" type="button">FULL SCREEN</button>

<main class="cleanup-shell">
  <div class="top-row">
    <div class="cleanup-title">CLEAN UP</div>
    <div class="video-wrap">
      <video id="cleanupSong" src="./cleanup-song.mp4" controls autoplay preload="auto" playsinline></video>
    </div>
  </div>

  <div class="steps-card">
    <img src="./cleanup-steps.png" alt="Clean up steps">
  </div>
</main>

<script>
(() => {
  const video = document.getElementById("cleanupSong");
  const fs = document.getElementById("cleanupFullscreen");

  const tryPlay = () => video?.play().catch(()=>{});
  tryPlay();
  window.addEventListener("load", tryPlay, {once:true});
  document.addEventListener("pointerdown", tryPlay, {once:true});

  const isFs = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
  fs.addEventListener("click", async () => {
    if(isFs()){
      try{
        if(document.exitFullscreen) await document.exitFullscreen();
        else if(document.webkitExitFullscreen) document.webkitExitFullscreen();
      }catch(e){}
      document.body.classList.remove("presentation-mode");
    }else{
      let entered = false;
      try{
        if(document.documentElement.requestFullscreen){
          await document.documentElement.requestFullscreen();
          entered = true;
        }else if(document.documentElement.webkitRequestFullscreen){
          document.documentElement.webkitRequestFullscreen();
          entered = true;
        }
      }catch(e){}
      if(!entered) document.body.classList.toggle("presentation-mode");
    }
    fs.textContent = (isFs() || document.body.classList.contains("presentation-mode"))
      ? "EXIT FULL SCREEN"
      : "FULL SCREEN";
  });

  document.addEventListener("fullscreenchange", () => {
    fs.textContent = isFs() ? "EXIT FULL SCREEN" : "FULL SCREEN";
  });
})();
</script>
</body>
</html>
