<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Clean Up</title>
<link rel="icon" type="image/png" href="./star.png?v=55">
<style>
@font-face{font-family:"KAHomebodyClub";src:url("./KAHomebodyClub.ttf") format("truetype");font-display:swap}
@font-face{font-family:"VAGTaskscreen";src:url("./VAG-Rounded-Std-Black_47296.ttf") format("truetype");font-display:swap}

:root{
  --pink:#F3237C;
  --orange:#F47607;
  --yellow:#FAB910;
  --green:#56A328;
  --blue:#27B8F5;
  --violet:#7618CF;
}

*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#fff;
}
body{font-family:"VAGTaskscreen",Arial,sans-serif}

/* Same tight rainbow border as the Grouper. */
body:before{
  content:"";
  position:fixed;
  inset:2.2% 1.4%;
  border-radius:6vw;
  box-shadow:
    inset 0 0 0 10px var(--pink),
    inset 0 0 0 20px var(--orange),
    inset 0 0 0 30px var(--yellow),
    inset 0 0 0 40px var(--green),
    inset 0 0 0 50px var(--blue),
    inset 0 0 0 60px var(--violet);
  pointer-events:none;
  z-index:20;
}

.cleanup-shell{
  position:fixed;
  inset:0;
  padding:
    calc(2.2vh + 72px)
    calc(1.4vw + 78px)
    calc(2.2vh + 74px);
  display:grid;
  grid-template-rows:minmax(150px,30%) minmax(0,1fr);
  gap:18px;
  background:#fff;
}

/* All white space above the picture is used by this row. */
.top-row{
  min-height:0;
  display:grid;
  grid-template-columns:minmax(0,1fr) minmax(320px,31vw);
  gap:24px;
  align-items:stretch;
}

.cleanup-title-wrap{
  min-width:0;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  padding:0 8px;
}

.cleanup-title{
  width:100%;
  text-align:center;
  font-family:"KAHomebodyClub","VAGTaskscreen",sans-serif;
  font-size:clamp(76px,8.5vw,150px);
  line-height:.82;
  color:var(--yellow);
  -webkit-text-stroke:3px #000;
  paint-order:stroke fill;
  text-shadow:
    -2px -2px 0 #000,
     2px -2px 0 #000,
    -2px  2px 0 #000,
     2px  2px 0 #000;
  white-space:nowrap;
  animation:cleanupFlash .95s ease-in-out infinite;
  transform-origin:center;
}

@keyframes cleanupFlash{
  0%,100%{opacity:1;transform:scale(1);filter:brightness(1)}
  50%{opacity:.38;transform:scale(1.035);filter:brightness(1.15)}
}

.video-wrap{
  width:100%;
  height:100%;
  min-height:0;
  display:flex;
  align-items:flex-start;
  justify-content:flex-end;
}
.video-wrap video{
  width:100%;
  max-height:100%;
  aspect-ratio:16/9;
  object-fit:contain;
  display:block;
  background:#000;
  border:5px solid #000;
  border-radius:18px;
  box-shadow:0 5px 16px rgba(0,0,0,.22);
}

/* Picture gets its own lower region and is intentionally a little smaller. */
.steps-card{
  min-height:0;
  display:flex;
  align-items:flex-end;
  justify-content:center;
  padding:4px 40px 12px;
  overflow:hidden;
}
.steps-card img{
  display:block;
  width:auto;
  max-width:92%;
  height:auto;
  max-height:92%;
  object-fit:contain;
  object-position:center bottom;
}

/* Controls remain inside the inner rainbow. */
.back-arrow,
.fullscreen-btn{
  position:fixed;
  z-index:30;
  background:#fff;
  color:#2d2940;
  border:3px solid #2d2940;
  border-radius:15px;
  text-decoration:none;
  font-family:"VAGTaskscreen",sans-serif;
  font-weight:900;
  box-shadow:0 2px 7px rgba(0,0,0,.15);
}
.back-arrow{
  left:calc(1.4vw + 26px);
  top:50%;
  transform:translateY(-50%);
  width:46px;
  height:46px;
  display:grid;
  place-items:center;
  font-size:27px;
}
.fullscreen-btn{
  right:calc(1.4vw + 28px);
  top:calc(2.2vh + 18px);
  height:43px;
  padding:0 13px;
  font-size:13px;
}

body.presentation-mode{
  position:fixed!important;
  inset:0!important;
  width:100vw!important;
  height:100vh!important;
}

@media(max-width:1000px){
  .cleanup-shell{
    padding:
      calc(2.2vh + 64px)
      calc(1.4vw + 68px)
      calc(2.2vh + 66px);
    grid-template-rows:minmax(120px,29%) minmax(0,1fr);
    gap:12px;
  }
  .top-row{
    grid-template-columns:minmax(0,1fr) minmax(260px,31vw);
    gap:14px;
  }
  .cleanup-title{font-size:clamp(58px,7vw,98px)}
  .steps-card{padding:2px 22px 8px}
  .steps-card img{max-width:90%;max-height:90%}
}

/* v37: MUCH larger flashing title + larger video, with hard non-overlap grid */
.cleanup-shell{
  grid-template-rows:minmax(220px,43%) minmax(0,57%)!important;
  gap:12px!important;
}
.top-row{
  display:grid!important;
  grid-template-columns:minmax(0,1fr) minmax(430px,42vw)!important;
  gap:20px!important;
  min-height:0!important;
  overflow:hidden!important;
}
.cleanup-title-wrap{min-width:0!important;min-height:0!important;overflow:hidden!important;padding:0!important}
.cleanup-title{
  height:100%!important;
  display:flex!important;
  flex-direction:column!important;
  align-items:center!important;
  justify-content:center!important;
  font-size:clamp(105px,10.5vw,205px)!important;
  line-height:.62!important;
  white-space:normal!important;
  overflow:hidden!important;
}
.cleanup-title span{display:block!important}
.video-wrap{min-width:0!important;min-height:0!important;overflow:hidden!important;align-items:center!important}
.video-wrap video{
  width:100%!important;
  height:100%!important;
  max-width:100%!important;
  max-height:100%!important;
  object-fit:contain!important;
}
.steps-card{min-height:0!important;overflow:hidden!important;padding:2px 28px 8px!important}
.steps-card img{max-width:90%!important;max-height:96%!important;object-fit:contain!important}
body.presentation-mode{position:fixed!important;inset:0!important;width:100vw!important;height:100vh!important}
@media(max-width:1000px){
 .top-row{grid-template-columns:minmax(0,1fr) minmax(320px,40vw)!important;gap:12px!important}
 .cleanup-title{font-size:clamp(82px,9.5vw,155px)!important}
}

</style>
</head>

<body>
<a class="back-arrow" href="./index.html?v=55" aria-label="Back to Task Screen">←</a>
<button class="fullscreen-btn" id="cleanupFullscreen" type="button">FULL SCREEN</button>

<main class="cleanup-shell">
  <div class="top-row">
    <div class="cleanup-title-wrap">
      <div class="cleanup-title"><span>CLEAN</span><span>UP</span></div>
    </div>

    <div class="video-wrap">
      <video id="cleanupSong" src="./cleanup-song.mp4" controls autoplay preload="auto" playsinline></video>
    </div>
  </div>

  <div class="steps-card">
    <img src="./cleanup-steps.png" alt="Clean up steps">
  </div>
</main>

<script>
(() => {
  const video = document.getElementById("cleanupSong");
  const fs = document.getElementById("cleanupFullscreen");

  const tryPlay = () => startCleanupVisit();
  window.addEventListener("load", tryPlay, {once:true});
  document.addEventListener("pointerdown", () => {
    if(!stoppedThisVisit && video?.paused) video.play().catch(()=>{});
  }, {once:true});

  const isTypingTarget = el =>
    !!el && (el.matches?.("input,textarea,select") || el.isContentEditable);

  let stoppedThisVisit = false;

  function startCleanupVisit() {
    stoppedThisVisit = false;
    try { video.currentTime = 0; } catch(e) {}
    video?.play().catch(()=>{});
  }

  function stopCleanupForVisit() {
    if(stoppedThisVisit) return;
    stoppedThisVisit = true;
    try { video?.pause(); } catch(e) {}
  }

  video?.addEventListener("play", () => {
    if(stoppedThisVisit) {
      try { video.pause(); } catch(e) {}
    }
  });

  /* SPACEBAR is STOP-ONLY for this visit.
     It will not resume until you leave Cleanup and come back. */
  window.addEventListener("keydown", e => {
    if((e.code !== "Space" && e.key !== " ") || isTypingTarget(e.target)) return;
    e.preventDefault();
    e.stopPropagation();
    stopCleanupForVisit();
    if(embedded) window.parent.postMessage({type:"stem-cleanup-stop"},"*");
  }, true);

  const isFs = () => !!(document.fullscreenElement || document.webkitFullscreenElement);

  fs.addEventListener("click", async () => {
    if(isFs()){
      try{
        if(document.exitFullscreen) await document.exitFullscreen();
        else if(document.webkitExitFullscreen) document.webkitExitFullscreen();
      }catch(e){}
      document.body.classList.remove("presentation-mode");
    }else{
      let entered = false;
      try{
        if(document.documentElement.requestFullscreen){
          await document.documentElement.requestFullscreen();
          entered = true;
        }else if(document.documentElement.webkitRequestFullscreen){
          document.documentElement.webkitRequestFullscreen();
          entered = true;
        }
      }catch(e){}
      if(!entered) document.body.classList.toggle("presentation-mode");
    }
    fs.textContent = (isFs() || document.body.classList.contains("presentation-mode"))
      ? "EXIT FULL SCREEN"
      : "FULL SCREEN";
  });

  document.addEventListener("fullscreenchange", () => {
    fs.textContent = isFs() ? "EXIT FULL SCREEN" : "FULL SCREEN";
  });

  const embedded = new URLSearchParams(location.search).get("embedded")==="1" || window.parent!==window;
  const go = url => {
    if(embedded){ window.parent.postMessage({type:"stem-overlay-close"},"*"); return; }
    if(isFs() || document.body.classList.contains("presentation-mode")){
      try{sessionStorage.setItem("stemPresentationMode","1")}catch(e){};
    }
    window.location.href = url;
  };
  window.addEventListener("message", e => {
    if(e.data?.type === "stem-overlay-show") {
      startCleanupVisit();
    }
  });
  if(embedded && fs) fs.style.display="none";

  document.querySelector(".back-arrow")?.addEventListener("click", e => {
    e.preventDefault();
    go("./index.html?v=55");
  });

  document.addEventListener("keydown", e => {
    if(isTypingTarget(e.target)) return;
    if(e.key === "ArrowLeft"){
      e.preventDefault();
      if(embedded) window.parent.postMessage({type:"stem-nav",source:"cleanup",key:"ArrowLeft"},"*");
      else go("./index.html?v=55");
    }
  });

  if((()=>{try{return sessionStorage.getItem("stemPresentationMode")==="1"}catch(e){return false}})()){
    document.body.classList.add("presentation-mode");
  }
})();
</script>

<script>
(()=>{
  document.body.classList.add("presentation-mode");
  try{try{sessionStorage.setItem("stemPresentationMode","1")}catch(e){}}catch(e){}
  if(new URLSearchParams(location.search).get("embedded")==="1" || window.parent!==window)return;
  let asked=false;
  const ask=async()=>{
    if(asked||document.fullscreenElement||document.webkitFullscreenElement)return;
    asked=true;
    const el=document.documentElement;
    const req=el.requestFullscreen||el.webkitRequestFullscreen||el.msRequestFullscreen;
    try{const r=req&&req.call(el);if(r&&r.then)await r}catch(e){}
  };
  document.addEventListener("pointerdown",ask,{once:true,capture:true});
  document.addEventListener("keydown",ask,{once:true,capture:true});
})();
</script>
</body>
</html>

<style>
.cleanup-title{
  line-height:.90!important;
  gap:4px!important;
  font-size:clamp(82px,8.4vw,160px)!important;
}
.cleanup-title span{
  display:block!important;
  line-height:.90!important;
  margin:0!important;
}
</style>
